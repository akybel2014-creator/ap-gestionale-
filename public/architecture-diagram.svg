<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" width="560" height="360" role="img" aria-labelledby="archTitle archDesc">
  <title id="archTitle">AI App Builder Technical Architecture and Workflow</title>
  <desc id="archDesc">Diagram illustrating the 4 modules of AI App Builder: Project Specification, Iterative Prompt History, Sandboxed Multi-Device HTML Preview, and LocalStorage / TXT Export.</desc>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#0891b2" />
    </linearGradient>
  </defs>

  <rect width="560" height="360" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2" />

  <!-- Header bar -->
  <rect x="24" y="20" width="512" height="44" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1" />
  <circle cx="46" cy="42" r="6" fill="#22d3ee" />
  <text x="62" y="46" fill="#f8fafc" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600">AI App Builder — Workspace Architecture (IT / EN / DE / FR)</text>

  <!-- Box 1: Project Spec -->
  <rect x="24" y="84" width="244" height="112" rx="12" fill="#0f172a" stroke="#06b6d4" stroke-width="1.5" />
  <text x="40" y="110" fill="#22d3ee" font-family="JetBrains Mono, monospace" font-size="11" font-weight="600">01. PROJECT DEFINITION</text>
  <text x="40" y="132" fill="#f1f5f9" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600">8 Project Categories</text>
  <text x="40" y="152" fill="#94a3b8" font-family="Inter, system-ui, sans-serif" font-size="11">Website, Web App, Landing Page,</text>
  <text x="40" y="168" fill="#94a3b8" font-family="Inter, system-ui, sans-serif" font-size="11">E-commerce, Dashboard, Portfolio, Blog</text>

  <!-- Box 2: BYOK AI Settings -->
  <rect x="292" y="84" width="244" height="112" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
  <text x="308" y="110" fill="#38bdf8" font-family="JetBrains Mono, monospace" font-size="11" font-weight="600">02. BYOK AI PROVIDERS</text>
  <text x="308" y="132" fill="#f1f5f9" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600">Multi-Model Settings</text>
  <text x="308" y="152" fill="#94a3b8" font-family="Inter, system-ui, sans-serif" font-size="11">OpenAI (GPT-4o), Anthropic (Claude 3.5),</text>
  <text x="308" y="168" fill="#94a3b8" font-family="Inter, system-ui, sans-serif" font-size="11">Groq (Llama 3.3), Custom API Endpoint</text>

  <!-- Box 3: Instruction Log -->
  <rect x="24" y="216" width="244" height="118" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
  <text x="40" y="242" fill="#38bdf8" font-family="JetBrains Mono, monospace" font-size="11" font-weight="600">03. ITERATIVE PROMPT LOG</text>
  <text x="40" y="264" fill="#f1f5f9" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600">Timestamped Instructions</text>
  <text x="40" y="284" fill="#94a3b8" font-family="Inter, system-ui, sans-serif" font-size="11">Sequential instructions (up to 1000 chars)</text>
  <text x="40" y="300" fill="#94a3b8" font-family="Inter, system-ui, sans-serif" font-size="11">Stored locally in browser localStorage</text>

  <!-- Box 4: Sandboxed Preview & Export -->
  <rect x="292" y="216" width="244" height="118" rx="12" fill="#0f172a" stroke="#06b6d4" stroke-width="1.5" />
  <text x="308" y="242" fill="#22d3ee" font-family="JetBrains Mono, monospace" font-size="11" font-weight="600">04. SANDBOX &amp; EXPORT</text>
  <text x="308" y="264" fill="#f1f5f9" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600">Live HTML Iframe &amp; .TXT</text>
  <text x="308" y="284" fill="#94a3b8" font-family="Inter, system-ui, sans-serif" font-size="11">Desktop (100%), Tablet (768px),</text>
  <text x="308" y="300" fill="#94a3b8" font-family="Inter, system-ui, sans-serif" font-size="11">Mobile (375px) + Code View &amp; Export</text>
</svg>
